spring:
  datasource:
    url: jdbc:mysql://localhost:3306/atelier?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  # DEV ONLY: returns the OTP in the API response and prints it in the console. Set DEV_OTP=false in production.
  dev-otp-in-response: ${DEV_OTP:true}
  mail-from: ${MAIL_FROM:no-reply@atelier.local}
  cors-origin: http://localhost:5173
  upload-dir: ${UPLOAD_DIR:uploads}
